name: CI

# Ported from the bybit-balance pipeline, adapted for a SwiftPM repo:
#   * build (swift build, release) is the hard gate;
#   * tests run with coverage and a per-file floor on the pure logic;
#   * swift-format runs as informational drift radar, not a blocker;
#   * actionlint hard-gates the workflow files themselves;
#   * Trivy filesystem scan (vuln, secret, misconfig) is a hard gate — a
#     secret-leaking commit must red the build. The Security-tab upload is
#     opt-in: it needs GitHub Advanced Security, which a private repo may lack.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  #  Build: the package in release configuration                        #
  # ------------------------------------------------------------------ #
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      # Swift 6.2 is the floor: pick the newest Xcode 26 explicitly and fail loudly
      # without one, instead of falling back to the image default (Swift 6.1).
      - name: Select Xcode 26
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No /Applications/Xcode_26*.app on this runner; Xcode 26 (Swift 6.2) is required."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xc=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"
          swift --version

      - name: Build (release)
        run: |
          swift --version
          set +e
          out=$(swift build -c release 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -n 40
          echo "## $([ $rc -eq 0 ] && echo '✅' || echo '❌') Build" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Style drift is surfaced, never blocking.
      - name: swift-format lint (informational)
        if: ${{ !cancelled() }}
        run: |
          set +e
          out=$(xcrun swift-format lint --recursive --parallel \
            Package.swift Sources Tests 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ] || [ -n "$out" ]; then
            echo "::warning::swift-format findings present (non-blocking)"
            {
              echo "## ⚠️ swift-format (informational)"
              echo ""
              echo '```'
              head -n 120 <<< "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ swift-format: clean" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------ #
  #  Tests: QuickTubeCore unit tests + a per-file coverage floor        #
  # ------------------------------------------------------------------ #
  tests:
    runs-on: macos-15
    # A hung AVFoundation test must not hold the runner for the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      # Swift 6.2 is the floor: pick the newest Xcode 26 explicitly and fail loudly
      # without one, instead of falling back to the image default (Swift 6.1).
      - name: Select Xcode 26
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "::error::No /Applications/Xcode_26*.app on this runner; Xcode 26 (Swift 6.2) is required."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xc=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)
          echo "Selecting $xc"
          sudo xcode-select -s "$xc"
          swift --version

      # The whole log goes to a file and is printed in full on failure: a crashed test
      # process loses its tail, so `tail` alone hides which test was running. A crash
      # (signal) in the parallel run is retried once with --no-parallel, which tells a
      # race between concurrently running suites from a test that crashes on its own;
      # the serial verdict decides the step, and the parallel crash stays a warning.
      - name: Run tests with coverage
        id: tests
        env:
          # The Swift runtime prints the crashing thread's backtrace to stderr.
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no
        run: |
          mkdir -p test-logs
          touch test-logs/.started
          summary() { grep -E "Executed [0-9]+ tests|Test run with|unexpected signal" "$1" | tail -n 3; }
          set +e
          swift test --enable-code-coverage > test-logs/swift-test.log 2>&1
          rc=$?
          set -e
          mode="parallel"
          if [ "$rc" -ne 0 ]; then
            echo "::group::Full output of the parallel run (exit $rc)"
            cat test-logs/swift-test.log
            echo "::endgroup::"
            if grep -q "Exited with unexpected signal" test-logs/swift-test.log; then
              sig=$(grep -oE "unexpected signal code [0-9]+" test-logs/swift-test.log | head -n 1)
              echo "::warning::Parallel test run crashed ($sig); rerunning with --no-parallel"
              echo "crashed=true" >> "$GITHUB_OUTPUT"
              mode="serial rerun after a parallel crash ($sig)"
              set +e
              swift test --enable-code-coverage --no-parallel > test-logs/swift-test-serial.log 2>&1
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                echo "::group::Full output of the --no-parallel run (exit $rc)"
                cat test-logs/swift-test-serial.log
                echo "::endgroup::"
              else
                tail -n 40 test-logs/swift-test-serial.log
              fi
            fi
          else
            tail -n 40 test-logs/swift-test.log
          fi
          {
            echo "## $([ "$rc" -eq 0 ] && echo '✅' || echo '❌') Tests ($mode)"
            echo ""
            echo '```'
            summary test-logs/swift-test.log
            if [ -f test-logs/swift-test-serial.log ]; then
              echo "--- --no-parallel:"
              summary test-logs/swift-test-serial.log
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Crash reports written while the tests ran, next to the full logs.
      - name: Collect crash reports
        if: ${{ !cancelled() && (steps.tests.outcome == 'failure' || steps.tests.outputs.crashed == 'true') }}
        run: |
          mkdir -p test-logs/DiagnosticReports
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] || continue
            find "$dir" -type f -newer test-logs/.started -exec cp {} test-logs/DiagnosticReports/ \; || true
          done
          ls -la test-logs/DiagnosticReports
          for f in test-logs/DiagnosticReports/*; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            head -c 200000 "$f"
            echo
            echo "::endgroup::"
          done

      - name: Upload test logs and crash reports
        if: ${{ !cancelled() && !env.ACT && (steps.tests.outcome == 'failure' || steps.tests.outputs.crashed == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: test-logs
          path: test-logs/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 30

      # Per-file floor: pure logic must stay fully tested. Add a file here
      # when it lands in QuickTubeCore and has no I/O of its own.
      - name: Coverage floor
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          CODECOV_JSON=$(swift test --show-codecov-path)
          echo "codecov: $CODECOV_JSON"
          # A crashed test run writes no coverage export. The tests step already failed
          # then; say so instead of a traceback. A green run without the export fails.
          if [ ! -f "$CODECOV_JSON" ]; then
            if [ "$TESTS_OUTCOME" = "success" ]; then
              echo "::error::Coverage export missing after a green test run: $CODECOV_JSON"
              echo "## ❌ Coverage floor: export missing after a green test run" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::Coverage floor skipped: no coverage export, the test run did not finish ($TESTS_OUTCOME)."
            echo "## ⏭️ Coverage floor: skipped (tests $TESTS_OUTCOME, no coverage export)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$CODECOV_JSON" <<'EOF'
          import json, os, sys

          # v2 floors are floor(measured) - 2. GIFUploader (88.29 %) and
          # RecordingFinisher (100 %) were measured on the macos-15 runner, which
          # has the encoders their AVFoundation end-to-end tests need; on a
          # machine without them those tests skip and these two floors fail.
          floors = {
              "AppSettings.swift": 82.0,
              "AppState.swift": 97.0,
              "CameraLayout.swift": 98.0,
              "CaptureTarget.swift": 89.0,
              "GIFUploader.swift": 86.0,
              "GoogleAuth.swift": 87.0,
              "HotkeyMigration.swift": 98.0,
              "KeyComboFormatter.swift": 98.0,
              "LocalSaver.swift": 98.0,
              "LoopbackServer.swift": 91.0,
              "PKCE.swift": 100.0,
              "RecordingCleanup.swift": 90.0,
              "RecordingFinisher.swift": 98.0,
              "RecordingNaming.swift": 100.0,
              "ShareLink.swift": 100.0,
              "YouTubeUploader.swift": 95.0,
          }

          with open(sys.argv[1]) as fh:
              export = json.load(fh)
          coverage = {
              os.path.basename(f["filename"]): f["summary"]["lines"]["percent"]
              for d in export.get("data", [])
              for f in d.get("files", [])
          }

          rows, failed = [], False
          for name, floor in floors.items():
              pct = coverage.get(name, -1.0)
              ok = pct >= 0 and pct + 1e-9 >= floor
              failed = failed or not ok
              mark = "✅" if ok else ("❌ not found" if pct < 0 else "❌")
              rows.append((name, pct, floor, mark))
              print(f"{name}: {pct:.2f}% (floor {floor:.0f}%) -> {mark}")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as s:
              print("### Coverage floor\n", file=s)
              print("| File | Coverage | Floor | |", file=s)
              print("| --- | ---: | ---: | :-: |", file=s)
              for name, pct, floor, mark in rows:
                  shown = "—" if pct < 0 else f"{pct:.2f}%"
                  print(f"| `{name}` | {shown} | {floor:.0f}% | {mark} |", file=s)
          sys.exit(1 if failed else 0)
          EOF

  # ------------------------------------------------------------------ #
  #  actionlint: hard gate over the workflow files themselves           #
  # ------------------------------------------------------------------ #
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: actionlint
        # The action shells out to docker, which act's job containers lack.
        if: ${{ !env.ACT }}
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4   # v0.1.13

      - name: actionlint results to Summary
        if: ${{ always() && !env.ACT }}
        run: |
          f="actionlint-errors.json"
          if [ -s "$f" ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('$f')) else 1)"; then
            {
              echo "## ❌ actionlint findings"
              echo ""
              echo '```'
              python3 -c "import json; [print(f\"{e['file']}:{e['line']}: {e['message']}\") for e in json.load(open('$f'))]"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ actionlint: clean" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------ #
  #  Security: Trivy filesystem scan (vulns, secrets, misconfig)        #
  #  A key-leaking commit must red the build. The Security-tab push is  #
  #  opt-in — it needs GitHub Advanced Security, which a private repo   #
  #  may not have.                                                      #
  # ------------------------------------------------------------------ #
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read   # codeql-action reads the run it belongs to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy table summary
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH

      - name: Scan results to Summary
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          try:
              sarif = json.load(open("trivy-results.sarif"))
              results = [r for run in sarif.get("runs", []) for r in run.get("results", [])]
          except Exception as e:
              print(f"## ⚠️ Trivy: could not parse SARIF ({e})", file=out)
              raise SystemExit(0)
          if not results:
              print("## ✅ Trivy: no findings", file=out)
          else:
              print(f"## ⚠️ Trivy: {len(results)} finding(s)", file=out)
              print("", file=out)
              print("| Rule | Level | Location |", file=out)
              print("| --- | --- | --- |", file=out)
              for r in results[:50]:
                  loc = ""
                  try:
                      loc = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
                  except Exception:
                      pass
                  print(f"| {r.get('ruleId','?')} | {r.get('level','?')} | {loc} |", file=out)
              if len(results) > 50:
                  print(f"\n_…{len(results)-50} more in the trivy-report artifact._", file=out)
          EOF

      - name: Upload Trivy report (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        if: ${{ always() && !env.ACT }}
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 90

      # The Security tab needs code scanning, which on a private repo means
      # GitHub Advanced Security. Without it the upload cannot succeed and
      # prints an error annotation on every run, so it is opt-in:
      #   gh variable set ENABLE_CODE_SCANNING --body true
      # The trivy-report artifact above carries the same SARIF either way.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938   # v4
        if: ${{ always() && !env.ACT && vars.ENABLE_CODE_SCANNING == 'true' }}
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the action enumerates the commits of its PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        if: ${{ !env.ACT }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.13"
          cache: pip
          # There is no requirements.txt at the root of a Swift repo, and the
          # default glob does not match a CI-only lock. Point at it.
          cache-dependency-path: .github/requirements-ci.lock

      - name: Install zizmor
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements-ci.lock

      # Blocking: a workflow that leaks its token or runs attacker-controlled
      # input is a supply-chain hole, not a style nit.
      - name: zizmor (workflow audit)
        run: |
          set +e
          out=$(zizmor --persona=regular --format plain .github/workflows 2>&1)
          rc=$?
          set -e
          echo "$out"
          {
            echo "## $([ $rc -eq 0 ] && echo '✅' || echo '❌') zizmor"
            echo ""
            echo '```'
            tail -n 60 <<< "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  sonar:
    # Opt-in: create the SonarQube Cloud project, switch Automatic Analysis
    # off (it refuses a CI analysis while that is on), add SONAR_TOKEN, then
    #   gh variable set ENABLE_SONAR_CI --body true
    if: ${{ vars.ENABLE_SONAR_CI == 'true' }}
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0   # Sonar attributes findings to commits; shallow blinds it
          persist-credentials: false

      # Swift is analysed from source -- no build wrapper needed. Coverage is
      # not sent; the per-file floor in the tests job already guards it.
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' && !env.ACT }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f   # v8.2.1

      # The scanner returns as soon as the upload lands; the verdict is computed
      # server-side afterwards. Without this step the job goes green while the
      # Quality Gate is still pending, and the findings stay on sonarcloud.io
      # where nothing in the run points at them.
      - name: Quality Gate and findings to Summary
        if: ${{ !cancelled() && env.SONAR_TOKEN != '' && !env.ACT }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          token = os.environ["SONAR_TOKEN"]
          summary_file = open(os.environ["GITHUB_STEP_SUMMARY"], "a")


          def say(line=""):
              """Write to the run summary and to the step log."""
              print(line, file=summary_file)
              print(line)


          def api(url):
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace").strip()
                  raise RuntimeError(f"{url.split('?')[0]} -> HTTP {exc.code} {detail}") from None


          def report_gate():
              """Write the verdict and the open issues; return True if the gate failed."""
              report = dict(
                  line.split("=", 1)
                  for line in open(".scannerwork/report-task.txt").read().splitlines()
                  if "=" in line
              )
              server, key, dashboard = (
                  report["serverUrl"],
                  report["projectKey"],
                  report["dashboardUrl"],
              )

              # The compute engine queues the analysis; poll it out rather than
              # guessing how long it takes.
              task = {}
              for _ in range(60):
                  task = api(report["ceTaskUrl"])["task"]
                  if task["status"] in ("SUCCESS", "FAILED", "CANCELED"):
                      break
                  time.sleep(5)

              if task.get("status") != "SUCCESS":
                  say(f"## ⚠️ Sonar: analysis {task.get('status', 'timed out')}")
                  say(f"\n[Dashboard]({dashboard})")
                  return False

              # A pull request analysis is not addressable by analysisId -- that
              # answers HTTP 400. Both endpoints take the same scope parameter,
              # so build it once from whatever the task says it analysed.
              if task.get("pullRequest"):
                  scope = "&" + urllib.parse.urlencode({"pullRequest": task["pullRequest"]})
              elif task.get("branch"):
                  scope = "&" + urllib.parse.urlencode({"branch": task["branch"]})
              else:
                  scope = ""

              gate = api(
                  f"{server}/api/qualitygates/project_status"
                  f"?{urllib.parse.urlencode({'projectKey': key})}{scope}"
              )["projectStatus"]
              mark = {"OK": "✅", "ERROR": "❌"}.get(gate["status"], "⚠️")
              say(f"## {mark} Sonar Quality Gate: {gate['status']}")
              say()

              failed = [c for c in gate.get("conditions", []) if c["status"] != "OK"]
              if failed:
                  say("| Condition | Actual | Threshold |")
                  say("| --- | ---: | ---: |")
                  for c in failed:
                      say(
                          f"| {c['metricKey']} | {c.get('actualValue', '?')} "
                          f"| {c['comparator']} {c.get('errorThreshold', '?')} |"
                      )
                  say()

              # SonarQube Cloud names this parameter componentKeys; "components"
              # is Server-only and answers HTTP 400 here.
              query = urllib.parse.urlencode(
                  {
                      "componentKeys": key,
                      "resolved": "false",
                      "ps": 50,
                      "s": "SEVERITY",
                      "asc": "false",
                  }
              )
              issues = api(f"{server}/api/issues/search?{query}{scope}")
              found = issues.get("issues", [])
              if not found:
                  say("No open issues.")
              else:
                  say(f"### {issues.get('total', len(found))} open issue(s)")
                  say()
                  say("| Rule | Impact | Location | Message |")
                  say("| --- | --- | --- | --- |")
                  for issue in found:
                      where = issue.get("component", "").split(":", 1)[-1]
                      line = issue.get("line")
                      impact = (
                          ", ".join(
                              f"{i['softwareQuality'].lower()}:{i['severity'].lower()}"
                              for i in issue.get("impacts", [])
                          )
                          or issue.get("severity", "?")
                      )
                      # A pipe in the message would split the table row.
                      message = issue.get("message", "").replace("|", "\\|")
                      say(
                          f"| `{issue.get('rule', '?')}` | {impact} "
                          f"| {where}{f':{line}' if line else ''} | {message} |"
                      )

              say(f"\n[Full report]({dashboard})")
              return gate["status"] == "ERROR"


          # A hiccup in the reporting itself is not a reason to red the build:
          # only the gate verdict is. The scan step already failed if the
          # analysis never reached Sonar.
          try:
              failed_gate = report_gate()
          except (OSError, RuntimeError, KeyError) as exc:
              say(f"## ⚠️ Sonar: could not read the verdict ({exc})")
              failed_gate = False

          raise SystemExit(1 if failed_gate else 0)
          EOF

      - name: Note a missing token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "## ⏭️ Sonar: skipped (no SONAR_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"
