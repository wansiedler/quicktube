name: CodeQL

# Semantic code scanning, the one analysis Trivy and the linters do not do:
# it follows data flow, so it catches taint reaching a sink rather than
# pattern-matching a line. Weekly, because new queries land after the code does.
#
# CodeQL has nowhere to publish without code scanning, which on a private repo
# means GitHub Advanced Security. Without it every run fails on the upload, so
# the whole workflow is opt-in, exactly like the Trivy SARIF push:
#   gh variable set ENABLE_CODE_SCANNING --body true

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ vars.ENABLE_CODE_SCANNING == 'true' }}
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2   # v4
        with:
          languages: swift
          build-mode: manual
          # security-extended adds the lower-precision queries; on a codebase
          # this small the extra noise is cheap and the extra reach is not.
          queries: security-extended

      # Swift is a traced language: CodeQL watches this build.
      - name: Build
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2   # v4
        with:
          category: /language:swift
