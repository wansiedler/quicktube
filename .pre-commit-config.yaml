# Swift tooling comes from Xcode's toolchain; the pre-commit-hooks and
# actionlint repos are fetched once by `pre-commit install` and cached.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: swift-format-lint
        name: swift-format lint
        entry: xcrun swift-format lint --strict
        language: system
        types: [swift]

      - id: no-google-oauth-secrets
        name: block Google OAuth client secrets and refresh tokens
        entry: '(GOCSPX-[A-Za-z0-9_-]{20,}|"refresh_token"\s*:\s*"1//[A-Za-z0-9_-]{20,})'
        language: pygrep
        types: [text]
        exclude: '\.pre-commit-config\.yaml$'

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
